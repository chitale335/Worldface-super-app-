  <body>
    <div id="root"></div>
    <div id="gt_drag_wrapper" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(15,23,42,0.9);padding:6px 10px;border-radius:10px;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,0.4);display:flex;align-items:center;gap:8px;cursor:grab;user-select:none;touch-action:none;">
      <span id="gt_drag_handle" style="color:#fff;font-size:14px;line-height:1;padding:0 4px;cursor:grab;">⋮⋮</span>
      <div id="google_translate_element"></div>
    </div>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'sw',
          includedLanguages: 'en,sw,fr,ar,yo,so,hi,pt,es,zh-CN,de,ru,tr,it,ja,ko',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
      (function() {
        const wrap = document.getElementById('gt_drag_wrapper');
        let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
        const saved = localStorage.getItem('gt_pos');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            wrap.style.left = p.x + 'px';
            wrap.style.top = p.y + 'px';
            wrap.style.transform = 'none';
          } catch (e) {}
        }
        const start = (x, y) => {
          dragging = true; moved = false;
          const r = wrap.getBoundingClientRect();
          ox = r.left; oy = r.top; sx = x; sy = y;
          wrap.style.transform = 'none';
          wrap.style.cursor = 'grabbing';
        };
        const move = (x, y) => {
          if (!dragging) return;
          moved = true;
          let nx = ox + (x - sx), ny = oy + (y - sy);
          nx = Math.max(0, Math.min(window.innerWidth - wrap.offsetWidth, nx));
          ny = Math.max(0, Math.min(window.innerHeight - wrap.offsetHeight, ny));
          wrap.style.left = nx + 'px';
          wrap.style.top = ny + 'px';
        };
        const end = () => {
          if (!dragging) return;
          dragging = false;
          wrap.style.cursor = 'grab';
          if (moved) localStorage.setItem('gt_pos', JSON.stringify({ x: parseFloat(wrap.style.left), y: parseFloat(wrap.style.top) }));
        };
        wrap.addEventListener('mousedown', e => { if (e.target.closest('select, .goog-te-combo')) return; start(e.clientX, e.clientY); e.preventDefault(); });
        window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
        window.addEventListener('mouseup', end);
        wrap.addEventListener('touchstart', e => { if (e.target.closest('select, .goog-te-combo')) return; const t = e.touches[0]; start(t.clientX, t.clientY); }, { passive: true });
        window.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
        window.addEventListener('touchend', end);
      })();
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
